<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Калькулятор стоимости маникюра</title>
<style>
:root{--bg:#f6f0f4;--card:rgba(255,255,255,.9);--ink:#2d1a2e;--mute:#7a6577;--line:#e6d9e1;--acc:#b0275f;--accsoft:#f8e3ec;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1220;--card:rgba(42,27,45,.9);--ink:#f6e9f1;--mute:#b9a3b4;--line:#44304a;--acc:#ec6fa0;--accsoft:#4a2340;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d1220;--card:rgba(42,27,45,.9);--ink:#f6e9f1;--mute:#b9a3b4;--line:#44304a;--acc:#ec6fa0;--accsoft:#4a2340;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:28px 16px 48px}
h1{font:600 clamp(26px,6vw,38px)/1.15 Georgia,"Times New Roman",serif;margin:0 0 6px}
.lead{color:var(--mute);margin:0 0 24px}
fieldset{border:1px solid var(--line);background:var(--card);border-radius:14px;margin:0 0 14px;padding:14px 16px 8px}
legend{float:left;width:100%;padding:0 6px;margin:0 0 4px;font-weight:600;font-size:19px;line-height:1.3}
legend+*{clear:both}
fieldset{padding-top:12px}
label.opt{display:flex;align-items:center;gap:10px;padding:9px 6px;font-size:18px;line-height:1.3;border-radius:10px;cursor:pointer}
label.opt:hover{background:var(--accsoft)}
label.opt input{accent-color:var(--acc);width:18px;height:18px;margin:0;flex:none}
label.opt .p{margin-left:auto;color:var(--mute);white-space:nowrap}
input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.count{display:flex;align-items:center;gap:10px;padding:4px 6px 10px 34px;color:var(--mute)}
.count.on{display:flex}
.count select{min-width:72px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.result{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:20px}
.result h2{font:600 22px Georgia,serif;margin:0 0 10px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line)}
th{color:var(--mute);font-weight:500;font-size:14px}
td:last-child,th:last-child{text-align:right;white-space:nowrap}
tfoot td{border:0;font-weight:700;font-size:22px;padding-top:14px}
tfoot td:last-child{color:var(--acc)}
.note{margin:12px 0 0;color:var(--mute);font-size:14px}
body{background:transparent}

<body>
<main>
<h1>Калькулятор стоимости маникюра</h1>
<p class="lead">Выберите параметры — итоговая цена посчитается сразу.</p>

<fieldset><legend>Маникюр</legend>
<label class="opt"><input type="radio" name="base" value="1100" data-t="Маникюр" checked>Маникюр<span class="p">1100 ₽</span></label>
<label class="opt"><input type="radio" name="base" value="1200" data-t="Маникюр + полное снятие">Маникюр + полное снятие<span class="p">1200 ₽</span></label>
<label class="opt"><input type="radio" name="base" value="1800" data-t="Маникюр + гель">Маникюр + гель<span class="p">1800 ₽</span></label>
</fieldset>

<fieldset><legend>Цвет</legend>
<label class="opt"><input type="checkbox" id="color" value="100" data-t="Цвет">Добавить цвет<span class="p">+100 ₽</span></label>
</fieldset>

<fieldset><legend>Снятие</legend>
<label class="opt"><input type="radio" name="remove" value="0" data-t="" checked>Снятие не нужно<span class="p">0 ₽</span></label>
<label class="opt"><input type="radio" name="remove" value="0" data-t="Снятие моего покрытия">Снятие моего покрытия<span class="p">0 ₽</span></label>
<label class="opt"><input type="radio" name="remove" value="200" data-t="Снятие работы другого мастера">Снятие работы другого мастера<span class="p">+200 ₽</span></label>
</fieldset>

<fieldset><legend>Ремонт</legend>
<label class="opt"><input type="radio" name="repair" value="0" data-t="" checked>Не нужен<span class="p">0 ₽</span></label>
<label class="opt"><input type="radio" name="repair" value="50" data-t="Ремонт">Ремонт<span class="p">+50 ₽</span></label>
<label class="opt"><input type="radio" name="repair" value="100" data-t="Ремонт, донаращивание">Донаращивание<span class="p">+100 ₽</span></label>
</fieldset>

<fieldset><legend>Дизайн</legend>
<label class="opt"><input type="radio" name="design" value="0" data-t="" checked>Без дизайна<span class="p">0 ₽</span></label>
<label class="opt"><input type="radio" name="design" value="200" data-t="Дизайн френч">Френч<span class="p">+200 ₽</span></label>
<label class="opt"><input type="radio" name="design" id="other" value="50" data-t="Стемпинг, рисунок, наклейки">Стемпинг, рисунок, наклейки за один ноготь<span class="p">+50 ₽</span></label>
<div class="count on" id="countRow"><label for="nails">Сколько ногтей</label><select id="nails"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option></select></div>
</fieldset>

<section class="result" aria-live="polite">
<h2>Ваш расчёт</h2>
<div class="tw"><table>
<thead><tr><th>Услуга</th><th>Цена</th></tr></thead>
<tbody id="rows"></tbody>
<tfoot><tr><td>Итого</td><td id="total">0 ₽</td></tr></tfoot>
</table></div>
<p class="note">Точная стоимость может отличаться. Уточняйте у мастера.</p>
</section>
</main>
<script>
var fmt=function(n){return n.toLocaleString("ru-RU")+" ₽"};
function calc(){
  var rows=[],sum=0;
  var nails=Math.min(10,Math.max(1,parseInt(document.getElementById("nails").value,10)||1));
  document.getElementById("countRow").classList.toggle("on",document.getElementById("other").checked);
  document.querySelectorAll("input:checked").forEach(function(el){
    if(el.id==="nails"||!el.dataset.t)return;
    var price=+el.value,title=el.dataset.t;
    if(el.id==="other"){price*=nails;title+=" (ногтей: "+nails+")"}
    rows.push([title,price]);sum+=price;
  });
  document.getElementById("rows").innerHTML=rows.map(function(r){return "<tr><td>"+r[0]+"</td><td>"+fmt(r[1])+"</td></tr>"}).join("");
  document.getElementById("total").textContent=fmt(sum);
}
document.getElementById("nails").addEventListener("change",function(){document.getElementById("other").checked=true});
document.addEventListener("input",calc);document.addEventListener("change",calc);calc();
</script>
</body>
</html>
